[package]
name = "wyrd-wallpaper"
version = "0.1.1"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
authors = ["xximxxhatedxx <ghostr210305@gmail.com>"]
rust-version = "1.90"
repository = "https://github.com/xximxxhatedxx/wyrd-wallpaper"
homepage = "https://github.com/xximxxhatedxx/wyrd-wallpaper"
keywords = ["wayland", "wallpaper", "layer-shell", "material-you"]
categories = ["gui", "command-line-utilities"]
readme = "README.md"
description = "Wayland wallpaper daemon with Material You palette extraction"

[workspace]
resolver = "2"

[dependencies]
wyrd-engine           = { version = "0.1.1", default-features = false, features = ["config", "lua"] }
libc                  = "0.2"
wayland-client        = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tiny-skia             = "0.12"
image                 = "0.25"
anyhow                = "1"
log                   = "0.4"
env_logger            = "0.11"
toml                  = "1"
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
clap                  = { version = "4", features = ["derive"] }
material-colors       = { version = "0.4", features = ["image"] }
