[package]
name = "wyrd-wallpaper"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["xximxxhatedxx <ghostr210305@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Dynamic Material You Wayland wallpaper daemon with multi-monitor rendering and palette extraction"
repository = "https://github.com/xximxxhatedxx/wyrd-wallpaper"
homepage = "https://github.com/xximxxhatedxx/wyrd-wallpaper"
readme = "README.md"

[[bin]]
name = "wyrd-wallpaper"
path = "src/main.rs"

[dependencies]
wyrd-engine           = { git = "https://github.com/xximxxhatedxx/wyrd-engine", tag = "v0.1.0" }
libc                  = "0.2"
wayland-client        = "0.31"
wayland-protocols     = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-backend       = "0.3"
tiny-skia             = "0.12"
image                 = "0.25"
tokio                 = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
anyhow                = "1"
log                   = "0.4"
env_logger            = "0.11"
toml                  = "0.8"
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
clap                  = { version = "4", features = ["derive"] }
material-colors       = { version = "0.4", features = ["image"] }
